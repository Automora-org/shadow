[project]
name = "shadow"
version = "1.1.1"
description = "Freeze observer captures and block a single process network on Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aesop" }]
keywords = ["windows", "tray", "firewall", "observer", "hotkey"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
  "pillow>=10.0.0",
  "psutil>=5.9.0",
  "keyboard>=0.13.5",
  "pystray>=0.19.5",
  "watchdog>=4.0.0",
]

[project.scripts]
shadow = "shadow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shadow"]

[tool.hatch.build.targets.wheel.force-include]
"shadow/assets/Inter-Regular.ttf" = "shadow/assets/Inter-Regular.ttf"
[tool.uv]
package = true

[dependency-groups]
dev = [
  "pyinstaller>=6.0.0",
]

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1). Leave empty to use pyproject.toml."
        required: false
        type: string
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      setup_name: ${{ steps.meta.outputs.setup_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          else
            VERSION="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' pyproject.toml | head -n1)"
            TAG="v${VERSION}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "Could not resolve version" >&2
            exit 1
          fi
          SETUP="Shadow-${VERSION}-windows-x64-setup.exe"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "setup_name=${SETUP}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=${TAG} setup=${SETUP}"

      - name: Sync version into pyproject.toml
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re
          version = os.environ["VERSION"]
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          updated, n = re.subn(
              r'(?m)^version\s*=\s*"[^"]*"',
              f'version = "{version}"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("Failed to update version in pyproject.toml")
          path.write_text(updated, encoding="utf-8")
          init = Path("shadow/__init__.py")
          init.write_text(
              '"""Shadow — freeze observer captures and block a process network."""\n\n'
              f'__version__ = "{version}"\n',
              encoding="utf-8",
          )
          print(f"version -> {version}")
          PY

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Verify Inter font asset
        shell: bash
        run: |
          test -f shadow/assets/Inter-Regular.ttf
          ls -lh shadow/assets/Inter-Regular.ttf

      - name: Build Shadow.exe
        run: uv run pyinstaller --noconfirm --clean shadow.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /? | Select-Object -First 3

      - name: Compile installer
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SETUP_NAME: ${{ steps.meta.outputs.setup_name }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "dist\Shadow.exe")) {
            throw "dist\Shadow.exe was not produced"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$env:VERSION" "installer\shadow.iss"
          $built = "dist\Shadow-$env:VERSION-windows-x64-setup.exe"
          if (-not (Test-Path $built)) {
            throw "Installer was not produced: $built"
          }
          if ($built -ne "dist\$env:SETUP_NAME") {
            Move-Item -Force $built "dist\$env:SETUP_NAME"
          }
          Get-Item "dist\$env:SETUP_NAME" | Format-List FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.setup_name }}
          path: dist/${{ steps.meta.outputs.setup_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.setup_name }}
          path: release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: Shadow ${{ needs.build-windows.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          fail_on_unmatched_files: true
          files: |
            release-assets/${{ needs.build-windows.outputs.setup_name }}
          body: |
            ## Shadow ${{ needs.build-windows.outputs.version }}

            ### Install (Windows x64)
            1. Download `Shadow-${{ needs.build-windows.outputs.version }}-windows-x64-setup.exe`
            2. Run the installer (UAC / Administrator recommended)
            3. Optionally create a desktop shortcut and start with Windows

            Network blocking requires Administrator privileges.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
